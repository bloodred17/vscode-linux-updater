[package]
name = "vscode-updater"
version = "0.1.0"
edition = "2024"
description = "Simple tool to update vscode for linux x64"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
flate2 = "1.1"
fs2 = "0.4"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1"
